# Partners on the home page ("Past sponsors and partners").
#
# name:    shown on the tile until a logo is added, and used as the logo's alt text
# url:     official site (optional; without it the tile is not a link)
# logo:    file in /assets/images/partners/ (optional)
# width, height: the logo file's size in pixels (the viewBox for SVGs), so the
#          page does not jump while logos load
# mark:    true when the logo is a symbol without the name; the name is shown
#          next to it
# size:    small for a heavy, solid logo that looks bigger than its neighbours
# tile:    dark for a logo made for dark backgrounds (white logo); keeps the
#          brand's own colours instead of recolouring the file
# events:  the events they backed, shown under the tile
#
# To add a logo: save the official file in assets/images/partners/, then add
# logo, width and height to the entry.

