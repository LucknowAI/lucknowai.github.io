- avatar: Rag Rishi
  name: Abhishek Sahu
  image: /assets/images/rag_rishi.jpeg
  linkedin: https://www.linkedin.com/in/a-sahu16/
  bio:
    - >-
      Abhishek is a Flutter developer by profession, but his heart truly beats
      for RAG (retrieval-augmented generation). Wherever he sees documents, the
      first words out of his mouth are, "Arey, ispe RAG kyun nahi laga rahe
      ho?" His passion for optimising retrieval systems and vector databases
      makes him a true RAG devotee.
    - >-
      And there is more: Abhishek also sings actual raag. When he is not
      diving into neural networks, he is probably singing classical Indian
      ragas. Whether it is a complex query or a classical tune, Rag Rishi will
      always find the right note.

