{%- case include.type -%}
  {%- when "hackathon" -%}<span class="label label-red">Hackathon</span>
  {%- when "summit" -%}<span class="label label-purple">Summit</span>
  {%- when "workshop" -%}<span class="label label-green">Workshop</span>
  {%- when "study-jam" -%}<span class="label label-green">Study jam</span>
  {%- when "paper-reading" -%}<span class="label label-blue">Paper reading</span>
  {%- when "meetup" -%}<span class="label label-blue">Meetup</span>
  {%- when "talk" -%}<span class="label label-blue">Talks</span>
  {%- when "ama" -%}<span class="label label-blue">AMA</span>
{%- endcase -%}
