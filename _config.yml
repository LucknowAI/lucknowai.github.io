# Lucknow AI Labs website (https://lucknowai.github.io)
# Built by GitHub Pages from the main branch with the "Just the Docs" theme,
# whose files live in this repository (_layouts, _includes, _sass).
# Run it locally: see README.md.

title: Lucknow AI Labs
description: >-
  Lucknow AI Labs is a volunteer-run AI community in Lucknow and the first
  chapter of UPAI Labs Foundation. Meetups, hackathons, paper reading and
  open-source projects.
baseurl: ""
url: "https://lucknowai.github.io"
repository: LucknowAI/lucknowai.github.io
permalink: pretty
lang: en-IN

# Default social preview image and author for search engines (jekyll-seo-tag)
logo: /assets/images/logo.png
social:
  name: Lucknow AI Labs
  links:
    - https://github.com/LucknowAI
    - https://x.com/AILucknow
    - https://www.instagram.com/lucknow_ai/
    - https://www.linkedin.com/company/lucknow-ai-labs/

exclude:
  - .sass-cache/
  - .jekyll-cache/
  - .github/
  - .vscode/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - README.md
  - docker-compose.yml
  - Dockerfile

plugins:
  - jekyll-seo-tag
  - jekyll-github-metadata
  - jekyll-include-cache
  - jekyll-redirect-from   # keeps old page addresses working
  - jekyll-sitemap

# Search
search_enabled: true
search:
  heading_level: 2
  previews: 2
  preview_words_before: 3
  preview_words_after: 3
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

enable_copy_code_button: true
heading_anchors: true

mermaid:
  version: "9.1.6"

# Links at the top right of every page
aux_links:
  "UPAI Labs":
    - "https://upailabs.org"
  "GitHub":
    - "https://github.com/LucknowAI"
aux_links_new_tab: true

nav_sort: case_sensitive
back_to_top: true
back_to_top_text: "Back to top"

footer_content: >-
  &copy; 2023-2026 Lucknow AI Labs, a chapter of
  <a href="https://upailabs.org">UPAI Labs Foundation</a>, a Section 8
  not-for-profit company. Volunteer-run in Lucknow.
  <a href="/code-of-conduct/">Code of conduct</a> &middot;
  Built with <a href="/license/">Just the Docs</a>

last_edit_timestamp: true
last_edit_time_format: "%b %e %Y"

gh_edit_link: true
gh_edit_link_text: "Suggest a change to this page on GitHub"
gh_edit_repository: "https://github.com/LucknowAI/lucknowai.github.io"
gh_edit_branch: "main"
gh_edit_view_mode: "edit"

# Dark theme with the yellow accent used across UPAI Labs (see _sass/color_schemes/lai.scss)
color_scheme: lai

callouts_level: quiet
callouts:
  highlight:
    color: yellow
  important:
    title: Important
    color: purple
  new:
    title: New
    color: green
  note:
    title: Note
    color: purple
  warning:
    title: Warning
    color: red

kramdown:
  syntax_highlighter_opts:
    block:
      line_numbers: false

compress_html:
  clippings: all
  comments: all
  endings: all
  startings: []
  blanklines: false
  profile: false
