{%- comment -%}
  Light / dark theme switch. include.variant: "desktop" (in the page header)
  or "mobile" (in the top bar next to the menu button). The script that makes
  it work is in _includes/head_custom.html.
{%- endcomment -%}
<button type="button" class="lai-theme-toggle lai-theme-toggle--{{ include.variant }}" data-lai-theme-toggle aria-label="Switch between light and dark theme" title="Switch between light and dark theme">
  <svg class="lai-icon-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path></svg>
  <svg class="lai-icon-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
</button>
