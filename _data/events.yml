# Fields
#   date        "YYYY-MM-DD" (first day, in quotes)
#   title       event name
#   type        meetup | workshop | talk | summit | hackathon | paper-reading | study-jam | ama
#   format      offline | online | hybrid   (leave out if not known)
#   venue       optional
#   organisers  who ran it, as listed on the event page or Commudle
#   link        optional external page (Commudle, GDG, ...)
#   recap       optional path of the recap page on this site
#   note        optional one-line highlight
#   status      optional: "unconfirmed" keeps an entry off the site until confirmed
#
# "AI Community Lucknow" was earlier called TFUG Lucknow.

